version: 2.1

# macOS-only build for dx-desktop (Zed fork).
# Windows + Linux build on the dev machine, so CircleCI does macOS only:
# Apple hardware is the only place macOS binaries can be produced.
#
# Runner facts, verified 2026-09-04 against CircleCI docs:
# - m4pro.medium (6 vCPU / 28 GiB) IS the Free-plan macOS class (free
#   default since Nov 2025; M1/M2 classes are end-of-life since Feb 2026
#   and must not be referenced).
# - Xcode 26.4.1 is a supported image on m4pro.medium.
# - Cost: 200 credits/min out of the 30,000/month pool, and Free jobs
#   hard-cap at 1 hour total. Zed full release builds are heavy: keep the
#   cargo cache warm (save/restore below) or every build stays cold and
#   risks the cap forever.
jobs:
  build-macos:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium # 6 vCPU / 28 GiB - free plan eligible
    working_directory: ~/repo
    environment:
      BASH_ENV: /tmp/BASH_ENV
    steps:
      - checkout
      - run:
          name: Install Rust toolchain
          command: |
            set -euo pipefail
            touch "$BASH_ENV"
            # rust-toolchain.toml pins the exact toolchain; rustup installs it.
            if ! command -v rustup &>/dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
      - run:
          name: Install macOS build dependencies
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install cmake pkgconf
            cmake --version
      - restore_cache:
          keys:
            - cargo-macos-{{ checksum "Cargo.lock" }}-{{ .Branch }}
            - cargo-macos-{{ checksum "Cargo.lock" }}
            - cargo-macos-
      - run:
          name: Build dx-desktop (macOS arm64 release)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            rustc --version && cargo --version
            cargo build --release -p zed --bin dx-desktop
      - save_cache:
          # Keep compiled deps even on failure so the next run resumes.
          key: cargo-macos-{{ checksum "Cargo.lock" }}-{{ .Branch }}
          when: on_fail
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ./target
      - run:
          name: Report binary size
          command: |
            ls -lh target/release/dx-desktop
            file target/release/dx-desktop || true
      - store_artifacts:
          path: target/release/dx-desktop
          destination: dx-desktop-macos-arm64
      - save_cache:
          key: cargo-macos-{{ checksum "Cargo.lock" }}-{{ .Branch }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ./target

workflows:
  version: 2
  macos-only:
    jobs:
      - build-macos
