version: 2.1

# Minimal linux-only build for dx-desktop.
# Builds the native Linux `dx-desktop` binary and stores it as an artifact
# for download to G:\Dx\bin. No macOS job, no tests, no clippy — to save credits.
#
# REQUIRED CircleCI project env var:
#   GITHUB_TOKEN — a GitHub PAT with `contents: read` on github.com/essence-dx/media
#   (Project Settings → Environment Variables → Add Variable)
jobs:
  build-linux:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CC: clang
      CXX: clang++
      # Use the system git CLI instead of libgit2 so git credential config
      # (set in the auth step below) is honoured when fetching private deps.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - checkout
      - run:
          name: Install Linux deps
          no_output_timeout: 30m
          command: |
            chmod +x ./script/linux ./script/download-wasi-sdk
            echo "=== switching apt from EC2 mirror to archive.ubuntu.com ==="
            sudo sed -i 's|http://us-east-1.ec2.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g; s|http://us-east-1.ec2.clouds.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
            grep -rh "^deb " /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -n 10 || true
            echo "=== suppressing needrestart interactive prompts ==="
            sudo mkdir -p /etc/needrestart/conf.d
            printf '%s\n' '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/99-ci.conf > /dev/null
            for i in 1 2 3; do
              echo "=== apt attempt $i/3 ==="
              if bash ./script/linux; then
                echo "deps OK on attempt $i"
                break
              fi
              echo "deps failed on attempt $i, retrying in 15s..."
              sleep 15
              if [ "$i" = "3" ]; then echo "deps failed after 3 attempts"; exit 1; fi
            done
      - run:
          name: Configure GitHub auth for private Cargo deps
          command: |
            # Injects GITHUB_TOKEN into all https://github.com/ fetch URLs so
            # cargo can clone the private essence-dx/media repo without SSH keys.
            # GITHUB_TOKEN must be set as a CircleCI project environment variable.
            git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run:
          name: Download WASI SDK
          command: bash ./script/download-wasi-sdk
      - restore_cache:
          keys:
            - cargo-registry-v2-{{ checksum "Cargo.lock" }}-{{ checksum "rust-toolchain.toml" }}
            - cargo-registry-v2-{{ checksum "Cargo.lock" }}-
            - cargo-registry-v2-
      - run:
          name: Build dx-desktop (linux release)
          # Full Zed release builds take 40-60 min; 10 min default would kill it.
          no_output_timeout: 60m
          command: |
            rustc -vV
            cargo build --release -p zed --bin dx-desktop
            ls -lh target/release/dx-desktop
            file target/release/dx-desktop || true
      - save_cache:
          key: cargo-registry-v2-{{ checksum "Cargo.lock" }}-{{ checksum "rust-toolchain.toml" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
      - store_artifacts:
          path: target/release/dx-desktop
          destination: dx-desktop-linux-x86_64

workflows:
  linux-only:
    jobs:
      - build-linux
