[filter]
command = "kubectl"
description = "Drop table headers and ready pods, keep errors and issues"

[[drop]]
pattern = "^NAME\\s+READY\\s+STATUS"

[[drop]]
pattern = "^default\\s+"

[[drop]]
pattern = "^\\s+\\d+/\\d+\\s+Running"

[preserve]
error_patterns = ["Error", "CrashLoop", "ImagePull", "ErrImage", "Pending", "Failed"]
