<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Router</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#ededed;font-family:system-ui,sans-serif}
.box{text-align:center}
.loader{width:48px;height:48px;border:3px solid rgba(255,255,255,0.12);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-weight:300;letter-spacing:0.04em;margin:0 0 8px}
p{opacity:0.6;font-size:14px;margin:0}
</style>
</head>
<body>
<div class="box">
<div class="loader"></div>
<h1>Router</h1>
<p>Route AI requests across providers — preview ready</p>
</div>
</body>
</html>
